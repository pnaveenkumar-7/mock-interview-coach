{% extends "base.html" %}

{% block title %}Log In - AI Mock Interview Coach{% endblock %}

{% block content %}
<div class="card auth-card">
  <h2 class="card-title">Welcome Back</h2>
  <p class="card-subtitle">Log in to practice your mock interviews</p>

  <form action="{{ url_for('auth.login') }}" method="POST">
    <!-- CSRF Token -->
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" class="form-control" value="{{ email or '' }}" required autofocus placeholder="student@example.com">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
    </div>

    <button type="submit" class="btn btn-primary btn-block">Log In</button>
  </form>

  <div class="auth-footer">
    Don't have a student account? <a href="{{ url_for('auth.register') }}">Register here</a>
  </div>
</div>
{% endblock %}
